name: Commit Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: commit-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitlint:
    name: Conventional commits (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # base_ref via env (not inline ${{ }}) to avoid template injection — zizmor.
      - name: Lint PR commit messages (conventional commits)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python -m pip install --disable-pip-version-check "gitlint-core==0.19.1"
          git fetch origin "${BASE_REF}" --depth=200
          gitlint --commits "origin/${BASE_REF}..HEAD"
